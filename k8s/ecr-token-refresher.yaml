apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresher-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
    namespace: kube-system
roleRef:
  kind: Role
  name: ecr-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresher
  namespace: kube-system
spec:
  schedule: "0 */8 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresher
          restartPolicy: OnFailure
          containers:
            - name: ecr-token-refresher
              image: alpine/k8s:1.31.0
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TOKEN=$(aws ecr get-login-password --region us-east-1)
                  kubectl delete secret ecr-secret -n default --ignore-not-found
                  kubectl create secret docker-registry ecr-secret \
                    --namespace=default \
                    --docker-server=270485099284.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$TOKEN"
                  echo "ECR secret successfully refreshed at $(date)"
