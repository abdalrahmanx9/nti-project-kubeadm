[control_plane]
k8s-master ansible_host=YOUR_MASTER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/nti-devops-key.pem

[workers]
k8s-worker-1 ansible_host=YOUR_WORKER1_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/nti-devops-key.pem
k8s-worker-2 ansible_host=YOUR_WORKER2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/nti-devops-key.pem

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
k8s_version="1.31"
pod_network_cidr="192.168.0.0/16"
